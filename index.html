<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TXT 閱讀器</title>
    <!-- 全螢幕 PWA 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #121212;
            --text: #D2C0A5;
            --panel: rgba(30, 28, 25, 0.92);
        }
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px calc(100px + env(safe-area-inset-bottom));
            line-height: 1.85;
            font-size: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            letter-spacing: 0.5px;
        }
        #status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            opacity: 0.6;
        }
        /* 懸浮控制列 (自動隱藏 + 適應 iPhone 底部安全區) */
        #controls {
            position: fixed;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(210, 192, 165, 0.2);
            border-radius: 25px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 100;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #controls.hidden {
            transform: translate(-50%, 120px);
            opacity: 0;
            pointer-events: none;
        }
        button, label {
            background: none;
            border: none;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            padding: 4px 6px;
            font-weight: 500;
        }
        #progress-text {
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            font-weight: 600;
            padding: 0 4px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="content">點擊下方「📁 開啟」選擇 TXT 小說檔...</div>
    <div id="status"></div>

    <div id="controls">
        <label for="fileInput">📁 開啟</label>
        <input type="file" id="fileInput" accept=".txt">
        <button id="btnPrev">上一頁</button>
        <span id="progress-text">0.0%</span>
        <button id="btnNext">下一頁</button>
        <button id="btnFontDown">A-</button>
        <button id="btnFontUp">A+</button>
    </div>

    <script>
        const content = document.getElementById('content');
        const fileInput = document.getElementById('fileInput');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progress-text');
        const controls = document.getElementById('controls');
        
        let fullText = "";
        let chunkSize = 80000; 
        let currentChunk = 0;
        let totalChunks = 0;
        let fontSize = 18;

        // IndexedDB 本地儲存
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("ReaderDB", 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore("books");
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e);
            });
        }

        async function saveBook(text) {
            const db = await openDB();
            const tx = db.transaction("books", "readwrite");
            tx.objectStore("books").put(text, "currentBook");
        }

        async function loadBook() {
            const db = await openDB();
            return new Promise((resolve) => {
                const tx = db.transaction("books", "readonly");
                const req = tx.objectStore("books").get("currentBook");
                req.onsuccess = () => resolve(req.result);
            });
        }

        function updateProgress() {
            if (!fullText || fullText.length === 0) return;
            const currentPos = (currentChunk * chunkSize) + window.scrollY;
            const percent = Math.min(100, Math.max(0, (currentPos / fullText.length) * 100));
            progressText.innerText = `${percent.toFixed(1)}%`;
        }

        function renderChunk(chunkIndex, scrollPos = 0) {
            if (!fullText) return;
            currentChunk = Math.max(0, Math.min(chunkIndex, totalChunks - 1));
            
            const start = currentChunk * chunkSize;
            const end = Math.min(start + chunkSize, fullText.length);
            
            content.innerText = fullText.substring(start, end);
            statusDiv.innerText = `--- 第 ${currentChunk + 1} / ${totalChunks} 頁 (全書 ${(fullText.length/10000).toFixed(0)} 萬字) ---`;

            localStorage.setItem('saved_chunk', currentChunk);
            
            if (scrollPos > 0) {
                setTimeout(() => {
                    window.scrollTo(0, scrollPos);
                    updateProgress();
                }, 50);
            } else {
                window.scrollTo(0, 0);
                updateProgress();
            }
        }

        // 智慧編碼解析（自動處置 GBK / UTF-8 亂碼問題）
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "載入中，請稍候...";
            const reader = new FileReader();

            reader.onload = async (evt) => {
                let text = evt.target.result;
                
                // 檢查是否有 UTF-8 亂碼特徵 (EF BF BD)
                if (text.includes("")) {
                    // 若有亂碼，改用 GBK 編碼重新讀取
                    const gbkReader = new FileReader();
                    gbkReader.onload = async (gbkEvt) => {
                        fullText = gbkEvt.target.result;
                        totalChunks = Math.ceil(fullText.length / chunkSize);
                        await saveBook(fullText);
                        renderChunk(0);
                    };
                    gbkReader.readAsText(file, "GBK");
                } else {
                    fullText = text;
                    totalChunks = Math.ceil(fullText.length / chunkSize);
                    await saveBook(fullText);
                    renderChunk(0);
                }
            };
            reader.readAsText(file, "UTF-8");
        });

        // 翻頁按鈕
        document.getElementById('btnNext').onclick = () => renderChunk(currentChunk + 1);
        document.getElementById('btnPrev').onclick = () => renderChunk(currentChunk - 1);

        // 字體大小
        document.getElementById('btnFontUp').onclick = () => { fontSize += 2; content.style.fontSize = fontSize + 'px'; };
        document.getElementById('btnFontDown').onclick = () => { if (fontSize > 12) fontSize -= 2; content.style.fontSize = fontSize + 'px'; };

        // 滑動自動隱藏 Bar & 紀錄位置
        let lastScrollY = window.scrollY;
        let scrollTimer;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            
            if (currentScrollY > lastScrollY + 10 && currentScrollY > 50) {
                controls.classList.add('hidden');
            } else if (currentScrollY < lastScrollY - 10 || currentScrollY < 50) {
                controls.classList.remove('hidden');
            }
            lastScrollY = currentScrollY;

            updateProgress();
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                localStorage.setItem('saved_scroll_pos', window.scrollY);
            }, 100);
        });

        // 載入恢復
        window.addEventListener('DOMContentLoaded', async () => {
            const savedText = await loadBook();
            if (savedText) {
                fullText = savedText;
                totalChunks = Math.ceil(fullText.length / chunkSize);
                
                const savedChunk = parseInt(localStorage.getItem('saved_chunk') || "0", 10);
                const savedPos = parseInt(localStorage.getItem('saved_scroll_pos') || "0", 10);
                
                renderChunk(savedChunk, savedPos);
            }
        });
    </script>
</body>
</html>
