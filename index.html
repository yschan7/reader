<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Safari 全螢幕 Web App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: rgba(30, 30, 30, 0.95);
      --border-color: #333;
      --font-size: 18px;
      --line-height: 1.8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 頂部工具列：自動隱藏效果 */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 10px 12px;
      transition: transform 0.3s ease;
      will-change: transform;
    }

    /* 滾動隱藏類別 */
    .toolbar.hidden {
      transform: translateY(-100%);
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .btn:active {
      opacity: 0.6;
    }

    input[type="file"] {
      display: none;
    }

    /* 文章內容區塊：左右邊距完全拉到最盡 (padding 0) */
    .content-container {
      width: 100%;
      padding: calc(env(safe-area-inset-top) + 70px) 0 env(safe-area-inset-bottom) 0;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .loading-status {
      font-size: 13px;
      color: #aaa;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- 固定/自動隱藏控制工具列 -->
  <div class="toolbar" id="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md,.text">
    
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    
    <button class="btn" id="lineIncBtn">行距 +</button>
    <button class="btn" id="lineDecBtn">行距 -</button>

    <span class="loading-status" id="statusText"></span>
  </div>

  <!-- 文章閱讀區域 -->
  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章...
  </div>

  <script>
    // 常用簡繁對照字典
    const dict = {
      '国':'國','这':'這','来':'來','时':'時','大':'大','动':'動','门':'門','间':'間','关':'關','书':'書','发':'發',
      '对':'對','说':'說','以':'以','主':'主','生':'生','年':'年','会':'會','同':'同','后':'後','自':'自','下':'下',
      '得':'得','看':'看','家':'家','种':'種','学':'學','多':'多','心':'心','法':'法','要':'要','出':'出','人':'人',
      '着':'著','体':'體','问':'問','只':'隻','样':'樣','现':'現','能':'能','成':'成','过':'過','里':'裡','面':'面',
      '好':'好','应':'應','想':'想','见':'見','分':'分','点':'點','作':'作','开':'開','位':'位','经':'經','公':'公',
      '长':'長','明':'明','相':'相','爱':'愛','备':'備','变':'變','标':'標','表':'錶','别':'別','病':'病','产':'產',
      '车':'車','传':'傳','当':'當','党':'黨','导':'導','队':'隊','风':'風','复':'複','个':'個','给':'給','观':'觀',
      '机':'機','极':'極','计':'計','记':'記','见':'見','简':'簡','节':'節','进':'進','军':'軍','开':'開','类':'類',
      '离':'離','两':'兩','难':'難','气':'氣','亲':'親','确':'確','认':'認','设':'設','识':'識','实':'實','数':'數',
      '头':'頭','图':'圖','无':'無','系':'係','显':'顯','选':'選','压':'壓','亚':'亞','业':'業','义':'義','议':'議',
      '运':'運','战':'戰','质':'質','种':'種','重':'重','总':'總','组':'組'
    };

    function fastS2T(text) {
      return text.replace(/[\u4e00-\u9fa5]/g, m => dict[m] || m);
    }

    const toolbar = document.getElementById('toolbar');
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineIncBtn = document.getElementById('lineIncBtn');
    const lineDecBtn = document.getElementById('lineDecBtn');
    const statusText = document.getElementById('statusText');

    // 1. 滾動隱藏/顯示工具列（支援 iOS Safari PWA 滾動特徵）
    let lastScrollY = 0;
    
    function handleScroll() {
      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      
      // 向下滑動且超過 30px 時隱藏
      if (currentScrollY > lastScrollY && currentScrollY > 30) {
        toolbar.classList.add('hidden');
      } else if (currentScrollY < lastScrollY) {
        // 向上滑動時顯示
        toolbar.classList.remove('hidden');
      }
      lastScrollY = currentScrollY;
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    document.addEventListener('scroll', handleScroll, { passive: true });

    // 2. 自動偵測 GBK / UTF-8 編碼並轉換，解決中文亂碼問題
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '讀取中...';
      textContent.textContent = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        // 偵測是否為 UTF-8 或 GBK 編碼
        let encoding = 'utf-8';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          utf8Decoder.decode(uint8Array.subarray(0, 10000));
        } catch (err) {
          // 若 UTF-8 解析失敗則切換為 GB18030 (相容 GBK / GB2312 中文檔案)
          encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 200000; // 每次處理 20萬 位元組
        let offset = 0;

        while (offset < uint8Array.length) {
          const chunk = uint8Array.subarray(offset, offset + chunkSize);
          const isFinal = offset + chunkSize >= uint8Array.length;
          const textChunk = decoder.decode(chunk, { stream: !isFinal });

          // 轉繁體並寫入
          const convertedChunk = fastS2T(textChunk);
          textContent.appendChild(document.createTextNode(convertedChunk));

          offset += chunkSize;
          const percent = Math.min(100, Math.round((offset / uint8Array.length) * 100));
          statusText.textContent = `${percent}%`;

          await new Promise(r => setTimeout(r, 0));
        }

        statusText.textContent = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toolbar.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        statusText.textContent = '讀取失敗';
      }
    });

    // 3. 字體大小調整
    let currentFontSize = 18;
    fontIncBtn.addEventListener('click', () => {
      currentFontSize += 1;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    });

    fontDecBtn.addEventListener('click', () => {
      if (currentFontSize > 8) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    // 4. 行距調整
    let currentLineHeight = 1.8;
    lineIncBtn.addEventListener('click', () => {
      currentLineHeight = parseFloat((currentLineHeight + 0.1).toFixed(1));
      document.documentElement.style.setProperty('--line-height', currentLineHeight);
    });

    lineDecBtn.addEventListener('click', () => {
      if (currentLineHeight > 1.0) {
        currentLineHeight = parseFloat((currentLineHeight - 0.1).toFixed(1));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
      }
    });
  </script>
</body>
</html>
