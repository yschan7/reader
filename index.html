<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Safari 全螢幕 Web App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: rgba(30, 30, 30, 0.95);
      --border-color: #333;
      --font-size: 24px;
      --line-height: 1.2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      /* 允許自然滾動以觸發 Safari 網址列自動隱藏 */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 頂部工具列：點擊切換顯示/隱藏 */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 10px 12px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    /* 隱藏狀態 */
    .toolbar.hidden {
      transform: translateY(-100%);
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .btn:active {
      opacity: 0.6;
    }

    /* 閱讀進度按鈕樣式 */
    .progress-btn {
      background-color: #2a2a2a;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    /* 文章內容區塊：左右邊距完全拉到最盡 (padding 0) */
    .content-container {
      width: 100%;
      padding: calc(env(safe-area-inset-top) + 80px) 0 calc(env(safe-area-inset-bottom) + 50px) 0;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .loading-status {
      font-size: 13px;
      color: #aaa;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- 固定/點擊切換隱藏控制工具列 -->
  <div class="toolbar" id="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md,.text">
    
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    
    <button class="btn" id="lineIncBtn">行距 +</button>
    <button class="btn" id="lineDecBtn">行距 -</button>

    <!-- 進度與快轉按鈕 -->
    <button class="btn progress-btn" id="progressBtn" title="點擊輸入進度">0.00%</button>

    <span class="loading-status" id="statusText"></span>
  </div>

  <!-- 文章閱讀區域 -->
  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章...
  </div>

  <script>

    const dict = {};
    for (let i = 0; i < s2tPairs.length; i += 2) {
      dict[s2tPairs[i]] = s2tPairs[i + 1];
    }

    function fastS2T(text) {
      return text.replace(/[\u4e00-\u9fa5]/g, m => dict[m] || m);
    }

    const toolbar = document.getElementById('toolbar');
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineIncBtn = document.getElementById('lineIncBtn');
    const lineDecBtn = document.getElementById('lineDecBtn');
    const progressBtn = document.getElementById('progressBtn');
    const statusText = document.getElementById('statusText');

    // 1. 點擊螢幕任意空白處切換隱藏/顯示工具列
    document.addEventListener('click', (e) => {
      if (toolbar.contains(e.target)) return;
      toolbar.classList.toggle('hidden');
    });

    // 2. 閱讀進度計算與顯示
    function updateProgress() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      
      if (scrollHeight <= 0) {
        progressBtn.textContent = '0.00%';
        return;
      }

      const percent = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
      progressBtn.textContent = `${percent.toFixed(2)}%`;
    }

    window.addEventListener('scroll', updateProgress, { passive: true });

    // 3. 點擊進度按鈕輸入 % 數快轉（支援多餘字元修復與容錯）
    progressBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentVal = parseFloat(progressBtn.textContent) || 0;
      const input = prompt('請輸入要跳轉的進度百分比 (0 - 100):', currentVal.toFixed(2));
      
      if (input !== null) {
        // 使用正則表達式擷取第一個合法的浮點數字（可處理包含 /、% 或空格的輸入）
        const match = input.match(/[-+]?[0-9]*\.?[0-9]+/);
        if (match) {
          const targetPercent = parseFloat(match[0]);
          if (!isNaN(targetPercent)) {
            // 自動限制範圍在 0 至 100 之間
            const clampedPercent = Math.min(100, Math.max(0, targetPercent));
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const targetY = (clampedPercent / 100) * scrollHeight;
            
            window.scrollTo({ top: targetY, behavior: 'smooth' });
          }
        }
      }
    });

    // 4. 自動偵測 GBK / UTF-8 編碼並載入檔案
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '讀取中...';
      textContent.textContent = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        let encoding = 'utf-8';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          utf8Decoder.decode(uint8Array.subarray(0, 10000));
        } catch (err) {
          encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 200000;
        let offset = 0;

        while (offset < uint8Array.length) {
          const chunk = uint8Array.subarray(offset, offset + chunkSize);
          const isFinal = offset + chunkSize >= uint8Array.length;
          const textChunk = decoder.decode(chunk, { stream: !isFinal });

          const convertedChunk = fastS2T(textChunk);
          textContent.appendChild(document.createTextNode(convertedChunk));

          offset += chunkSize;
          const percent = Math.min(100, Math.round((offset / uint8Array.length) * 100));
          statusText.textContent = `${percent}%`;

          await new Promise(r => setTimeout(r, 0));
        }

        statusText.textContent = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toolbar.classList.remove('hidden');
        updateProgress();
      } catch (err) {
        console.error(err);
        statusText.textContent = '讀取失敗';
      }
    });

    // 5. 字體與行距調整（預設：字體 24px，行距 1.2）
    let currentFontSize = 24;
    fontIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFontSize += 1;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    });

    fontDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFontSize > 8) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    let currentLineHeight = 1.2;
    lineIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLineHeight = parseFloat((currentLineHeight + 0.1).toFixed(1));
      document.documentElement.style.setProperty('--line-height', currentLineHeight);
    });

    lineDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentLineHeight > 0.8) {
        currentLineHeight = parseFloat((currentLineHeight - 0.1).toFixed(1));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
      }
    });
  </script>
</body>
</html>
