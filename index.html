<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  
  <!-- 高精準度 OpenCC 繁簡轉換庫 -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: rgba(30, 30, 30, 0.95);
      --border-color: #333;
      --font-size: 26px;
      --line-height: 1.3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: auto !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 頂部工具列：單列緊湊佈局 */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 8px 12px;
      overflow-x: auto;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .toolbar::-webkit-scrollbar {
      display: none;
    }

    .toolbar.hidden {
      transform: translateY(-100%);
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .btn:active {
      opacity: 0.6;
    }

    .progress-btn {
      background-color: #2a2a2a;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 進度滑桿容器 */
    .progress-slider-container {
      display: flex;
      align-items: center;
      width: 90px;
      flex-shrink: 0;
    }

    .progress-slider {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4CAF50;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    /* 文章內容區塊 */
    .content-container {
      width: 100%;
      padding: calc(env(safe-area-inset-top) + 60px) 16px calc(env(safe-area-inset-bottom) + 60px) 16px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
      transform: translateZ(0);
    }

    .loading-status {
      font-size: 12px;
      color: #aaa;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md,.text">
    
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    
    <button class="btn" id="lineIncBtn">行距 +</button>
    <button class="btn" id="lineDecBtn">行距 -</button>

    <button class="btn progress-btn" id="progressBtn">0.00%</button>

    <div class="progress-slider-container">
      <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" step="0.1" value="0">
    </div>

    <span class="loading-status" id="statusText"></span>
  </div>

  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章...
  </div>

  <script>
    // 初始化 OpenCC 繁簡轉換
    const converter = window.OpenCC ? window.OpenCC.Converter({ from: 'cn', to: 'hk' }) : text => text;

    // 將各類引號轉為標準繁體中文標點「」與『』
    function formatQuotes(text) {
      return text
        // 先替換雙引號 “ ” 轉為 「 」
        .replace(/“/g, '「')
        .replace(/”/g, '」')
        // 替換單引號 ‘ ’ 轉為 『 』
        .replace(/‘/g, '『')
        .replace(/’/g, '』')
        // 配對處理英文雙引號 "text" 轉成 「text」
        .replace(/"([^"]+)"/g, '「$1」')
        // 配對處理英文單引號 'text' 轉成 『text』
        .replace(/'([^']+)'/g, '『$1』');
    }

    const toolbar = document.getElementById('toolbar');
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineIncBtn = document.getElementById('lineIncBtn');
    const lineDecBtn = document.getElementById('lineDecBtn');
    const progressBtn = document.getElementById('progressBtn');
    const progressSlider = document.getElementById('progressSlider');
    const statusText = document.getElementById('statusText');

    let isUserDraggingSlider = false;

    // 1. 點擊空白處隱藏/顯示選單
    document.addEventListener('click', (e) => {
      if (toolbar.contains(e.target)) return;
      toolbar.classList.toggle('hidden');
    });

    // 2. 頁面滾動時更新 % 數與滑桿位置
    function updateProgressUI() {
      if (isUserDraggingSlider) return;

      const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      
      if (scrollHeight <= 0) {
        progressBtn.textContent = '0.00%';
        progressSlider.value = 0;
        return;
      }

      const percent = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
      progressBtn.textContent = `${percent.toFixed(2)}%`;
      progressSlider.value = percent;
    }

    let scrollTimer;
    window.addEventListener('scroll', () => {
      if (scrollTimer) cancelAnimationFrame(scrollTimer);
      scrollTimer = requestAnimationFrame(updateProgressUI);
    }, { passive: true });

    // 3. 滑桿拖動控制
    progressSlider.addEventListener('mousedown', () => isUserDraggingSlider = true);
    progressSlider.addEventListener('touchstart', () => isUserDraggingSlider = true, { passive: true });

    progressSlider.addEventListener('input', (e) => {
      const targetPercent = parseFloat(e.target.value);
      progressBtn.textContent = `${targetPercent.toFixed(2)}%`;
      
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const targetY = (targetPercent / 100) * scrollHeight;
      
      window.scrollTo(0, targetY);
    });

    progressSlider.addEventListener('mouseup', () => isUserDraggingSlider = false);
    progressSlider.addEventListener('touchend', () => isUserDraggingSlider = false);

    // 4. 點擊數字按鈕輸入精準進度
    progressBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentVal = parseFloat(progressBtn.textContent) || 0;
      const input = prompt('請輸入跳轉進度 (0 - 100):', currentVal.toFixed(2));
      
      if (input !== null) {
        const targetPercent = parseFloat(input);
        if (!isNaN(targetPercent)) {
          const clamped = Math.min(100, Math.max(0, targetPercent));
          const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const targetY = (clamped / 100) * scrollHeight;

          window.scrollTo(0, targetY);
          updateProgressUI();
        }
      }
    });

    // 5. 檔案載入、轉碼與引號處理
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '載入中...';
      textContent.innerHTML = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        let encoding = 'utf-8';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          utf8Decoder.decode(uint8Array.subarray(0, 5000));
        } catch (err) {
          encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 100000;
        let offset = 0;
        const fragment = document.createDocumentFragment();

        while (offset < uint8Array.length) {
          const chunk = uint8Array.subarray(offset, offset + chunkSize);
          const isFinal = offset + chunkSize >= uint8Array.length;
          const textChunk = decoder.decode(chunk, { stream: !isFinal });

          // 先進行繁簡轉換，再修正引號
          const convertedChunk = formatQuotes(converter(textChunk));
          fragment.appendChild(document.createTextNode(convertedChunk));

          offset += chunkSize;
          statusText.textContent = `${Math.min(100, Math.round((offset / uint8Array.length) * 100))}%`;
          await new Promise(r => setTimeout(r, 0));
        }

        textContent.appendChild(fragment);
        statusText.textContent = '';
        window.scrollTo(0, 0);
        toolbar.classList.remove('hidden');
        updateProgressUI();
      } catch (err) {
        console.error(err);
        statusText.textContent = '載入失敗';
      }
    });

    // 6. 字體與行距調整
    let currentFontSize = 26;
    fontIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFontSize += 1;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    });

    fontDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFontSize > 10) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    let currentLineHeight = 1.3;
    lineIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLineHeight = parseFloat((currentLineHeight + 0.1).toFixed(1));
      document.documentElement.style.setProperty('--line-height', currentLineHeight);
    });

    lineDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentLineHeight > 0.8) {
        currentLineHeight = parseFloat((currentLineHeight - 0.1).toFixed(1));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
      }
    });
  </script>
</body>
</html>
