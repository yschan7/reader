<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: rgba(30, 30, 30, 0.95);
      --border-color: #333;
      --font-size: 26px;
      --line-height: 1.3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      /* 禁用 smooth 滾動，防止 iOS 在長頁面跳轉時 GPU 崩潰 */
      scroll-behavior: auto !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 10px 12px;
      transition: transform 0.2s ease;
    }

    .toolbar.hidden {
      transform: translateY(-100%);
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .btn:active {
      opacity: 0.6;
    }

    .progress-btn {
      background-color: #2a2a2a;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    .content-container {
      width: 100%;
      padding: calc(env(safe-area-inset-top) + 70px) 16px calc(env(safe-area-inset-bottom) + 70px) 16px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
      /* 啟用硬體加速優化渲染 */
      transform: translateZ(0);
    }

    .loading-status {
      font-size: 13px;
      color: #aaa;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md,.text">
    
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    
    <button class="btn" id="lineIncBtn">行距 +</button>
    <button class="btn" id="lineDecBtn">行距 -</button>

    <button class="btn progress-btn" id="progressBtn">0.00%</button>

    <span class="loading-status" id="statusText"></span>
  </div>

  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章...
  </div>

    function fastS2T(text) {
      return text.replace(/[\u4e00-\u9fa5]/g, m => S2T_MAP[m] || m);
    }

    const toolbar = document.getElementById('toolbar');
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineIncBtn = document.getElementById('lineIncBtn');
    const lineDecBtn = document.getElementById('lineDecBtn');
    const progressBtn = document.getElementById('progressBtn');
    const statusText = document.getElementById('statusText');

    // 1. 點擊螢幕空白處切換工具列
    document.addEventListener('click', (e) => {
      if (toolbar.contains(e.target)) return;
      toolbar.classList.toggle('hidden');
    });

    // 2. 閱讀進度更新
    function updateProgress() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      if (scrollHeight <= 0) {
        progressBtn.textContent = '0.00%';
        return;
      }
      const percent = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
      progressBtn.textContent = `${percent.toFixed(2)}%`;
    }

    let scrollTimer;
    window.addEventListener('scroll', () => {
      if (scrollTimer) cancelAnimationFrame(scrollTimer);
      scrollTimer = requestAnimationFrame(updateProgress);
    }, { passive: true });

    // 3. 安全快速跳轉（防 Safari GPU 崩潰）
    progressBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentVal = parseFloat(progressBtn.textContent) || 0;
      const input = prompt('請輸入跳轉進度 (0 - 100):', currentVal.toFixed(2));
      
      if (input !== null) {
        const targetPercent = parseFloat(input);
        if (!isNaN(targetPercent)) {
          const clamped = Math.min(100, Math.max(0, targetPercent));
          const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const targetY = (clamped / 100) * scrollHeight;

          // 核心修復：使用瞬間跳轉取代平滑滾動，避免 iOS Safari 在幾百萬像素長度下繪圖線程直接 Crash
          window.scrollTo(0, targetY);
          updateProgress();
        }
      }
    });

    // 4. 讀取與分區塊渲染
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '載入中...';
      textContent.innerHTML = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        let encoding = 'utf-8';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          utf8Decoder.decode(uint8Array.subarray(0, 5000));
        } catch (err) {
          encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 150000;
        let offset = 0;
        const fragment = document.createDocumentFragment();

        while (offset < uint8Array.length) {
          const chunk = uint8Array.subarray(offset, offset + chunkSize);
          const isFinal = offset + chunkSize >= uint8Array.length;
          const textChunk = decoder.decode(chunk, { stream: !isFinal });

          const convertedChunk = fastS2T(textChunk);
          fragment.appendChild(document.createTextNode(convertedChunk));

          offset += chunkSize;
          statusText.textContent = `${Math.min(100, Math.round((offset / uint8Array.length) * 100))}%`;
          await new Promise(r => setTimeout(r, 0));
        }

        textContent.appendChild(fragment);
        statusText.textContent = '';
        window.scrollTo(0, 0);
        toolbar.classList.remove('hidden');
        updateProgress();
      } catch (err) {
        console.error(err);
        statusText.textContent = '載入失敗';
      }
    });

    // 5. 字體與行距
    let currentFontSize = 26;
    fontIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFontSize += 1;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    });

    fontDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFontSize > 10) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    let currentLineHeight = 1.3;
    lineIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLineHeight = parseFloat((currentLineHeight + 0.1).toFixed(1));
      document.documentElement.style.setProperty('--line-height', currentLineHeight);
    });

    lineDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentLineHeight > 0.8) {
        currentLineHeight = parseFloat((currentLineHeight - 0.1).toFixed(1));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
      }
    });
  </script>
</body>
</html>
