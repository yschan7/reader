<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Safari 全螢幕 Web App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: rgba(30, 30, 30, 0.95);
      --border-color: #333;
      --font-size: 18px;
      --line-height: 1.8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 頂部工具列：點擊切換顯示/隱藏 */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 12px 10px 12px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    /* 隱藏狀態 */
    .toolbar.hidden {
      transform: translateY(-100%);
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .btn:active {
      opacity: 0.6;
    }

    /* 閱讀進度按鈕樣式 */
    .progress-btn {
      background-color: #2a2a2a;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    /* 文章內容區塊 */
    .content-container {
      width: 100%;
      padding: calc(env(safe-area-inset-top) + 70px) 12px calc(env(safe-area-inset-bottom) + 20px) 12px;
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .loading-status {
      font-size: 13px;
      color: #aaa;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- 固定/點擊切換隱藏控制工具列 -->
  <div class="toolbar" id="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md,.text">
    
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    
    <button class="btn" id="lineIncBtn">行距 +</button>
    <button class="btn" id="lineDecBtn">行距 -</button>

    <!-- 進度與快轉按鈕 -->
    <button class="btn progress-btn" id="progressBtn" title="點擊輸入進度">0%</button>

    <span class="loading-status" id="statusText"></span>
  </div>

  <!-- 文章閱讀區域 -->
  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章...
  </div>

  <script>
    // 常用轉換對照，自動將常見簡體字轉為繁體字
    const dict = {
      '国':'國','这':'這','来':'來','时':'時','动':'動','门':'門','间':'間','关':'關','书':'書','发':'發',
      '对':'對','说':'說','会':'會','后':'後','种':'種','学':'學','体':'體','问':'問','只':'隻','样':'樣',
      '现':'現','过':'過','里':'裡','面':'面','应':'應','见':'見','点':'點','开':'開','经':'經','长':'長',
      '爱':'愛','备':'備','变':'變','标':'標','别':'別','产':'產','车':'車','传':'傳','当':'當','党':'黨',
      '导':'導','队':'隊','风':'風','复':'複','个':'個','给':'給','观':'觀','机':'機','极':'極','计':'計',
      '记':'記','简':'簡','节':'節','进':'進','军':'軍','类':'類','离':'離','两':'兩','难':'難','气':'氣',
      '亲':'親','确':'確','认':'認','设':'設','识':'識','实':'實','数':'數','头':'頭','图':'圖','无':'無',
      '系':'係','显':'顯','选':'選','压':'壓','亚':'亞','业':'業','义':'義','议':'議','运':'運','战':'戰',
      '质':'質','重':'重','总':'總','组':'組','东':'東','陕':'陝','广':'廣','场':'場','报':'報','诉':'訴',
      '乐':'樂','师':'師','师':'師','张':'張','强':'強','话':'話','听':'聽','写':'寫','读':'讀','欢':'歡'
    };

    function fastS2T(text) {
      return text.replace(/[\u4e00-\u9fa5]/g, m => dict[m] || m);
    }

    const toolbar = document.getElementById('toolbar');
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineIncBtn = document.getElementById('lineIncBtn');
    const lineDecBtn = document.getElementById('lineDecBtn');
    const progressBtn = document.getElementById('progressBtn');
    const statusText = document.getElementById('statusText');

    // 1. 點擊螢幕任意空白處切換隱藏/顯示工具列
    document.addEventListener('click', (e) => {
      // 若點擊的是工具列內部的按鈕/元素，不觸發隱藏
      if (toolbar.contains(e.target)) return;
      toolbar.classList.toggle('hidden');
    });

    // 2. 閱讀進度計算與顯示
    function updateProgress() {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      
      if (scrollHeight <= 0) {
        progressBtn.textContent = '0%';
        return;
      }

      const percent = Math.min(100, Math.max(0, Math.round((scrollTop / scrollHeight) * 100)));
      progressBtn.textContent = `${percent}%`;
    }

    window.addEventListener('scroll', updateProgress, { passive: true });

    // 3. 點擊進度按鈕輸入 % 數快轉
    progressBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // 防止觸發工具列隱藏
      const input = prompt('請輸入要跳轉的進度百分比 (0 - 100):', parseInt(progressBtn.textContent) || 0);
      if (input !== null) {
        const targetPercent = parseFloat(input);
        if (!isNaN(targetPercent) && targetPercent >= 0 && targetPercent <= 100) {
          const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
          const targetY = (targetPercent / 100) * scrollHeight;
          window.scrollTo({ top: targetY, behavior: 'smooth' });
        }
      }
    });

    // 4. 自動偵測 GBK / UTF-8 編碼並載入檔案
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusText.textContent = '讀取中...';
      textContent.textContent = '';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const uint8Array = new Uint8Array(arrayBuffer);

        let encoding = 'utf-8';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          utf8Decoder.decode(uint8Array.subarray(0, 10000));
        } catch (err) {
          encoding = 'gb18030';
        }

        const decoder = new TextDecoder(encoding);
        const chunkSize = 200000;
        let offset = 0;

        while (offset < uint8Array.length) {
          const chunk = uint8Array.subarray(offset, offset + chunkSize);
          const isFinal = offset + chunkSize >= uint8Array.length;
          const textChunk = decoder.decode(chunk, { stream: !isFinal });

          const convertedChunk = fastS2T(textChunk);
          textContent.appendChild(document.createTextNode(convertedChunk));

          offset += chunkSize;
          const percent = Math.min(100, Math.round((offset / uint8Array.length) * 100));
          statusText.textContent = `${percent}%`;

          await new Promise(r => setTimeout(r, 0));
        }

        statusText.textContent = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        toolbar.classList.remove('hidden');
        updateProgress();
      } catch (err) {
        console.error(err);
        statusText.textContent = '讀取失敗';
      }
    });

    // 5. 字體與行距調整
    let currentFontSize = 18;
    fontIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFontSize += 1;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
    });

    fontDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFontSize > 8) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    let currentLineHeight = 1.8;
    lineIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLineHeight = parseFloat((currentLineHeight + 0.1).toFixed(1));
      document.documentElement.style.setProperty('--line-height', currentLineHeight);
    });

    lineDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentLineHeight > 1.0) {
        currentLineHeight = parseFloat((currentLineHeight - 0.1).toFixed(1));
        document.documentElement.style.setProperty('--line-height', currentLineHeight);
      }
    });
  </script>
</body>
</html>
