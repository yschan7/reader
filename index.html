<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Safari 全螢幕 Web App 模式（加到主畫面後可隱藏網址列） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>極簡閱讀器</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --panel-bg: #1e1e1e;
      --border-color: #333;
      --font-size: 18px;
      --line-height: 1.8;
    }

    /* 亮色主題 */
    body.light-theme {
      --bg-color: #f9f9f9;
      --text-color: #1a1a1a;
      --panel-bg: #ffffff;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      /* 支援 iPhone 瀏海與底部 Safe Area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 固定頂部工具列 */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
    }

    .btn {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:active {
      opacity: 0.7;
    }

    input[type="file"] {
      display: none;
    }

    /* 文章內容區塊：左右完全無邊距 (padding: 0) */
    .content-container {
      width: 100%;
      padding: 16px 0; /* 上下留白，左右完全拉到最盡 */
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: break-word;
      white-space: pre-wrap;
    }

    .content-container p {
      margin-bottom: 1em;
    }
  </style>
</head>
<body>

  <!-- 控制工具列 -->
  <div class="toolbar">
    <label class="btn" for="fileInput">📁 開啟檔案</label>
    <input type="file" id="fileInput" accept=".txt,.html,.md">
    
    <button class="btn" id="themeBtn">🌙 切換主題</button>
    <button class="btn" id="fontIncBtn">字體 +</button>
    <button class="btn" id="fontDecBtn">字體 -</button>
    <button class="btn" id="lineHeightBtn">行距: 1.8x</button>
  </div>

  <!-- 閱讀區域 -->
  <div class="content-container" id="textContent">
    請點擊上方「開啟檔案」載入文章，或直接在此貼上內文...
  </div>

  <script>
    // 簡體轉繁體常用字典與轉換函數
    function convertS2T(str) {
      if (!str) return '';
      const s = '两个国这来时大动门间关书发对说以主生年会同后自下得看家种学多心法自要出人着体问只样现能成过里面好法应样想见分点作开位经公长明相得明法';
      const t = '兩個國這來時大動門間關書發對說以主生年會同後自下得看家種學多心法自要出人著體問隻樣現能成過裏面好法應樣想見分點作開位經公長明相得明法';
      
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        const index = s.indexOf(char);
        if (index !== -1) {
          result += t[index];
        } else {
          result += char;
        }
      }
      return result;
    }

    // 元素綁定
    const textContent = document.getElementById('textContent');
    const fileInput = document.getElementById('fileInput');
    const themeBtn = document.getElementById('themeBtn');
    const fontIncBtn = document.getElementById('fontIncBtn');
    const fontDecBtn = document.getElementById('fontDecBtn');
    const lineHeightBtn = document.getElementById('lineHeightBtn');

    // 1. 檔案讀取與自動簡轉繁
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const rawText = evt.target.result;
        // 自動轉換簡體字為繁體字
        const convertedText = convertS2T(rawText);
        textContent.textContent = convertedText;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      reader.readAsText(file);
    });

    // 2. 切換主題
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      themeBtn.textContent = isLight ? '☀️ 淺色主題' : '🌙 暗色主題';
    });

    // 3. 調較字體大小
    let currentFontSize = 18;
    fontIncBtn.addEventListener('click', () => {
      if (currentFontSize < 36) {
        currentFontSize += 2;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    fontDecBtn.addEventListener('click', () => {
      if (currentFontSize > 12) {
        currentFontSize -= 2;
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      }
    });

    // 4. 調較上下行距
    const lineHeights = [1.4, 1.8, 2.2];
    let lineHeightIndex = 1;

    lineHeightBtn.addEventListener('click', () => {
      lineHeightIndex = (lineHeightIndex + 1) % lineHeights.length;
      const selectedLineHeight = lineHeights[lineHeightIndex];
      document.documentElement.style.setProperty('--line-height', selectedLineHeight);
      lineHeightBtn.textContent = `行距: ${selectedLineHeight}x`;
    });
  </script>
</body>
</html>
